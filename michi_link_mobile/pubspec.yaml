name: michi_link_mobile
description: Aplicación móvil para la localización de mascotas mediante radiofrecuencia LoRa
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  bloc: ^9.2.1
  cloud_firestore: ^6.10.0
  country_flags: ^4.1.2
  equatable: ^3.0.0
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_performance: ^0.11.6
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hugeicons: ^1.2.0
  intl: ^0.20.3
  material_ui: ^1.5.0
  package_info_plus: ^10.2.1

dev_dependencies:
  bloc_lint: ^0.4.3
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.25
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - .env

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-VariableFont.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-VariableFont.ttf
        - asset: assets/fonts/Merriweather-Italic-VariableFont.ttf
          style: italic
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont.ttf
        - asset: assets/fonts/Montserrat-Italic-VariableFont.ttf
          style: italic
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont.ttf
        - asset: assets/fonts/Nunito-Italic-VariableFont.ttf
          style: italic
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-VariableFont.ttf
        - asset: assets/fonts/OpenSans-Italic-VariableFont.ttf
          style: italic
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-VariableFont.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic-VariableFont.ttf
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont.ttf
        - asset: assets/fonts/Roboto-Italic-VariableFont.ttf
          style: italic
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-VariableFont.ttf
        - asset: assets/fonts/SourceCodePro-Italic-VariableFont.ttf
          style: italic
