name: michi_link_mobile
description: Aplicación móvil para la localización de mascotas mediante radiofrecuencia LoRa
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  bloc: ^9.2.1
  cloud_firestore: ^7.0.0
  country_flags: ^4.1.2
  equatable: ^3.0.0
  expressive_kit: ^0.0.5
  firebase_analytics: ^13.0.0
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_performance: ^0.12.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  geolocator: ^14.1.1
  get_it: ^9.3.0
  go_router: ^18.1.0
  google_maps_flutter: ^2.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hugeicons: ^1.2.0
  intl: ^0.20.3
  material_ui: ^1.7.0
  package_info_plus: ^10.2.2
  shimmer: ^4.0.0

dev_dependencies:
  bloc_lint: ^0.4.3
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.25
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter_launcher_icons:
  android: true
  image_path_android: "assets/images/app-main-logo-rounded.png"
  adaptive_icon_background: "#06224E"
  adaptive_icon_foreground: "assets/images/app-main-logo-rounded.png"
  ios: true
  image_path_ios: "assets/images/app-main-logo-rounded.png"
  remove_alpha_ios: true
  background_color_ios: "#06224E"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/cats/
    - .env

