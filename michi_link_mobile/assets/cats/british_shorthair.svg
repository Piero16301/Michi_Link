  <!-- Chubby Cheeks Highlight -->
  <ellipse cx="26" cy="80" rx="9" ry="12" fill="#B0BEC5" opacity="0.4"/>
  <ellipse cx="102" cy="80" rx="9" ry="12" fill="#B0BEC5" opacity="0.4"/>

  <!-- Cheerful Happy Eyebrows -->
  <path d="M33 46C37 41 45 41 51 45" stroke="#263238" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M95 46C91 41 83 41 77 45" stroke="#263238" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- Happy Smiling Copper Anime Eyes -->
  <!-- Left Eye -->
  <g>
    <path d="M30 63C30 52 40 47 48 51C55 55 56 68 53 74C48 80 36 78 32 72C30 69 30 66 30 63Z" fill="#FFFFFF"/>
    <path d="M33 63C33 54 40 50 46 53C52 56 53 66 50 71C46 76 37 75 34 70C33 68 33 65 33 63Z" fill="url(#bsh_eye)"/>
    <ellipse cx="43" cy="63" rx="5.5" ry="7.5" fill="#1A0A00"/>
    <path d="M36 67C38 72 44 74 48 71" stroke="#FFD180" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <circle cx="39" cy="58" r="3.5" fill="#FFFFFF"/>
    <circle cx="46" cy="66" r="1.8" fill="#FFFFFF"/>
