<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- British Shorthair slate blue coat gradient -->
    <linearGradient id="bsh_coat" x1="64" y1="20" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#90A4AE"/>
      <stop offset="50%" stop-color="#78909C"/>
      <stop offset="100%" stop-color="#546E7A"/>
    </linearGradient>
    <!-- Inner ear pink-slate gradient -->
    <linearGradient id="bsh_ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
    <!-- Brilliant copper orange eye gradient -->
    <linearGradient id="bsh_eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4D1A00"/>
      <stop offset="35%" stop-color="#A33600"/>
      <stop offset="70%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFAE42"/>
    </linearGradient>
  </defs>

  <!-- Body / Chest Peek -->
  <path d="M38 106C36 116 46 126 64 126C82 126 92 116 90 106C78 102 50 102 38 106Z" fill="#546E7A" stroke="#263238" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Left Ear Exterior -->
  <path d="M26 14C22 13 17 18 16 23C14 34 17 46 25 54L45 34C38 24 31 16 26 14Z" fill="url(#bsh_coat)" stroke="#263238" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left Ear Interior -->
  <path d="M26 20C22 26 22 38 27 44C30 40 35 34 38 30C33 24 29 20 26 20Z" fill="url(#bsh_ear)"/>
  <!-- Left Ear Tufts -->
  <path d="M25 42C27 38 31 35 36 35C33 38 32 42 32 45C34 42 38 41 41 42C38 45 35 48 30 48C28 48 26 45 25 42Z" fill="#ECEFF1"/>

  <!-- Right Ear Exterior -->
  <path d="M102 14C106 13 111 18 112 23C114 34 111 46 103 54L83 34C90 24 97 16 102 14Z" fill="url(#bsh_coat)" stroke="#263238" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right Ear Interior -->
  <path d="M102 20C106 26 106 38 101 44C98 40 93 34 90 30C95 24 99 20 102 20Z" fill="url(#bsh_ear)"/>
  <!-- Right Ear Tufts -->
  <path d="M103 42C101 38 97 35 92 35C95 38 96 42 96 45C94 42 90 41 87 42C90 45 93 48 98 48C100 48 102 45 103 42Z" fill="#ECEFF1"/>

  <!-- Head Base with Extra-Chubby Chipmunk Jowls -->
  <path d="
    M64 22
    C84 22 104 34 108 50
    C114 60 120 72 116 86
    C112 98 98 108 78 109
    C72 109.5 68 110 64 110
    C60 110 56 109.5 50 109
    C30 108 16 98 12 86
    C8 72 14 60 20 50
    C24 34 44 22 64 22Z" 
