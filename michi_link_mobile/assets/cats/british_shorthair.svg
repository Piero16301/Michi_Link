    <path d="M26 60C28 50 38 46 49 50C53 51 54 54 53 55C50 54 42 49 33 53C29 55 26 60 25 62Z" fill="#263238"/>
    <path d="M26 60C24 57 23 53 26 50C26 53 25 57 26 60Z" fill="#263238"/>
    <!-- Smiling lower eyelid contour -->
    <path d="M33 68C37 72 45 72 50 68" stroke="#263238" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Right Eye -->
  <g>
    <path d="M98 63C98 52 88 47 80 51C73 55 72 68 75 74C80 80 92 78 96 72C98 69 98 66 98 63Z" fill="#FFFFFF"/>
    <path d="M95 63C95 54 88 50 82 53C76 56 75 66 78 71C82 76 91 75 94 70C95 68 95 65 95 63Z" fill="url(#bsh_eye)"/>
    <ellipse cx="85" cy="63" rx="5.5" ry="7.5" fill="#1A0A00"/>
    <path d="M92 67C90 72 84 74 80 71" stroke="#FFD180" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <circle cx="82" cy="58" r="3.5" fill="#FFFFFF"/>
    <circle cx="89" cy="66" r="1.8" fill="#FFFFFF"/>
    <!-- Upward joyful eyeliner wing -->
    <path d="M102 60C100 50 90 46 79 50C75 51 74 54 75 55C78 54 86 49 95 53C99 55 102 60 103 62Z" fill="#263238"/>
    <path d="M102 60C104 57 105 53 102 50C102 53 103 57 102 60Z" fill="#263238"/>
    <!-- Smiling lower eyelid contour -->
    <path d="M95 68C91 72 83 72 78 68" stroke="#263238" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Cute Rosy Blush on Chubby Jowls -->
  <ellipse cx="26" cy="74" rx="7" ry="4" fill="#FF8A80" opacity="0.45"/>
  <ellipse cx="102" cy="74" rx="7" ry="4" fill="#FF8A80" opacity="0.45"/>

  <!-- Slate-Blue Button Nose -->
  <path d="M64 77C67.5 77 70 74 69.5 72C69 70.5 67 70 64 70C61 70 59 70.5 58.5 72C58 74 60.5 77 64 77Z" fill="#455A64"/>
  <ellipse cx="63.5" cy="71.8" rx="2.5" ry="1" fill="#78909C"/>

  <!-- Beaming Open Smiling Mouth -->
  <path d="M55 81C55 81 57 89 64 89C71 89 73 81 73 81C68 82.5 60 82.5 55 81Z" fill="#A82828"/>
  <path d="M58 85C60.5 87.8 64 88.5 64 88.5C64 88.5 67.5 87.8 70 85C67 84.2 61 84.2 58 85Z" fill="#FF8DA1"/>
  <!-- Upturned :3 lip line -->
  <path d="M64 77V81M64 81C61 81 56 80 51 77.5M64 81C67 81 72 80 77 77.5" stroke="#263238" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Whisker Dots -->
  <circle cx="50" cy="76" r="1.2" fill="#37474F"/>
  <circle cx="45" cy="79" r="1.2" fill="#37474F"/>
  <circle cx="78" cy="76" r="1.2" fill="#37474F"/>
  <circle cx="83" cy="79" r="1.2" fill="#37474F"/>

  <!-- Outer Silhouette Outline -->
  <path d="
    M64 22
    C84 22 104 34 108 50
    C114 60 120 72 116 86
    C112 98 98 108 78 109
    C72 109.5 68 110 64 110
    C60 110 56 109.5 50 109
    C30 108 16 98 12 86
    C8 72 14 60 20 50
    C24 34 44 22 64 22Z" 
    stroke="#263238" stroke-width="2.5" fill="none"/>

  <!-- Elegant Curving White Whiskers (Rendered on top of everything) -->
  <g stroke="#ECEFF1" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M42 78C28 78 16 82 6 87"/>
    <path d="M40 83C26 86 16 94 10 102"/>
    <path d="M86 78C100 78 112 82 122 87"/>
    <path d="M88 83C102 86 112 94 118 102"/>
  </g>
</svg>
