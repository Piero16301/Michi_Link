<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Russian Blue silvery slate coat gradient -->
    <linearGradient id="rb_coat" x1="64" y1="20" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B0BEC5"/>
      <stop offset="50%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#607D8B"/>
    </linearGradient>
    <!-- Inner ear delicate pink glow gradient -->
    <linearGradient id="rb_ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCDD2"/>
      <stop offset="100%" stop-color="#EF9A9A"/>
    </linearGradient>
    <!-- Luminous jade green eye gradient -->
    <linearGradient id="rb_eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003B16"/>
      <stop offset="35%" stop-color="#008033"/>
      <stop offset="70%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#B9F6CA"/>
    </linearGradient>
  </defs>

  <!-- Body / Chest Peek -->
  <path d="M38 106C36 116 46 126 64 126C82 126 92 116 90 106C78 102 50 102 38 106Z" fill="#607D8B" stroke="#263238" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Left Ear Exterior -->
  <path d="M22 6C19 4 14 8 13 12C11 24 13 40 22 50L44 28C36 16 28 8 22 6Z" fill="url(#rb_coat)" stroke="#263238" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left Ear Interior -->
  <path d="M22 12C18 20 18 34 24 42C28 38 34 30 38 26C32 18 26 13 22 12Z" fill="url(#rb_ear)" opacity="0.9"/>
  <!-- Left Ear Tufts -->
  <path d="M22 40C24 36 28 33 34 33C30 36 28 41 28 44C31 41 36 39 40 40C36 44 32 48 26 48C24 48 22 44 22 40Z" fill="#ECEFF1"/>

  <!-- Right Ear Exterior -->
  <path d="M106 6C109 4 114 8 115 12C117 24 115 40 106 50L84 28C92 16 100 8 106 6Z" fill="url(#rb_coat)" stroke="#263238" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right Ear Interior -->
  <path d="M106 12C110 20 110 34 104 42C100 38 94 30 90 26C96 18 102 13 106 12Z" fill="url(#rb_ear)" opacity="0.9"/>
  <!-- Right Ear Tufts -->
  <path d="M106 40C104 36 100 33 94 33C98 36 100 41 100 44C97 41 92 39 88 40C92 44 96 48 102 48C104 48 106 44 106 40Z" fill="#ECEFF1"/>

  <!-- Sleek Head Base with Silvery-Blue Glow -->
  <path d="
    M64 22
    C84 22 104 36 108 56
    C112 68 114 80 108 92
    C100 104 84 109 64 109
    C44 109 28 104 20 92
    C14 80 16 68 20 56
    C24 36 44 22 64 22Z" 
    fill="url(#rb_coat)" stroke="#263238" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Silver Highlights on forehead & cheeks -->
  <path d="M50 30C58 28 70 28 78 30" stroke="#ECEFF1" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="28" cy="74" rx="6" ry="8" fill="#ECEFF1" opacity="0.3"/>
  <ellipse cx="100" cy="74" rx="6" ry="8" fill="#ECEFF1" opacity="0.3"/>

  <!-- Cheerful Happy Eyebrows -->
  <path d="M33 46C37 41 45 41 51 45" stroke="#263238" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M95 46C91 41 83 41 77 45" stroke="#263238" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- Happy Smiling Jade Green Anime Eyes -->
  <!-- Left Eye -->
  <g>
    <path d="M30 63C30 52 40 47 48 51C55 55 56 68 53 74C48 80 36 78 32 72C30 69 30 66 30 63Z" fill="#FFFFFF"/>
    <path d="M33 63C33 54 40 50 46 53C52 56 53 66 50 71C46 76 37 75 34 70C33 68 33 65 33 63Z" fill="url(#rb_eye)"/>
    <ellipse cx="43" cy="63" rx="5.5" ry="7.5" fill="#00210B"/>
    <path d="M36 67C38 72 44 74 48 71" stroke="#A7FFEB" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <circle cx="39" cy="58" r="3.5" fill="#FFFFFF"/>
    <circle cx="46" cy="66" r="1.8" fill="#FFFFFF"/>
    <!-- Upward joyful eyeliner wing -->
    <path d="M26 60C28 50 38 46 49 50C53 51 54 54 53 55C50 54 42 49 33 53C29 55 26 60 25 62Z" fill="#263238"/>
    <path d="M26 60C24 57 23 53 26 50C26 53 25 57 26 60Z" fill="#263238"/>
    <!-- Smiling lower eyelid contour -->
    <path d="M33 68C37 72 45 72 50 68" stroke="#263238" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Right Eye -->
  <g>
    <path d="M98 63C98 52 88 47 80 51C73 55 72 68 75 74C80 80 92 78 96 72C98 69 98 66 98 63Z" fill="#FFFFFF"/>
    <path d="M95 63C95 54 88 50 82 53C76 56 75 66 78 71C82 76 91 75 94 70C95 68 95 65 95 63Z" fill="url(#rb_eye)"/>
    <ellipse cx="85" cy="63" rx="5.5" ry="7.5" fill="#00210B"/>
    <path d="M92 67C90 72 84 74 80 71" stroke="#A7FFEB" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <circle cx="82" cy="58" r="3.5" fill="#FFFFFF"/>
    <circle cx="89" cy="66" r="1.8" fill="#FFFFFF"/>
    <!-- Upward joyful eyeliner wing -->
    <path d="M102 60C100 50 90 46 79 50C75 51 74 54 75 55C78 54 86 49 95 53C99 55 102 60 103 62Z" fill="#263238"/>
    <path d="M102 60C104 57 105 53 102 50C102 53 103 57 102 60Z" fill="#263238"/>
    <!-- Smiling lower eyelid contour -->
    <path d="M95 68C91 72 83 72 78 68" stroke="#263238" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Cute Rosy Blush Cheeks -->
  <ellipse cx="28" cy="73" rx="6" ry="3.5" fill="#FF8A80" opacity="0.45"/>
  <ellipse cx="100" cy="73" rx="6" ry="3.5" fill="#FF8A80" opacity="0.45"/>

  <!-- Slate-Blue Button Nose -->
  <path d="M64 77C67.5 77 70 74 69.5 72C69 70.5 67 70 64 70C61 70 59 70.5 58.5 72C58 74 60.5 77 64 77Z" fill="#455A64"/>
  <ellipse cx="63.5" cy="71.8" rx="2.5" ry="1" fill="#78909C"/>

  <!-- Beaming Open Smiling Mouth -->
  <path d="M55 81C55 81 57 89 64 89C71 89 73 81 73 81C68 82.5 60 82.5 55 81Z" fill="#A82828"/>
  <path d="M58 85C60.5 87.8 64 88.5 64 88.5C64 88.5 67.5 87.8 70 85C67 84.2 61 84.2 58 85Z" fill="#FF8DA1"/>
  <!-- Upturned :3 lip line -->
  <path d="M64 77V81M64 81C61 81 56 80 51 77.5M64 81C67 81 72 80 77 77.5" stroke="#263238" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Whisker Dots -->
  <circle cx="50" cy="76" r="1" fill="#78909C"/>
  <circle cx="46" cy="79" r="1" fill="#78909C"/>
  <circle cx="78" cy="76" r="1" fill="#78909C"/>
  <circle cx="82" cy="79" r="1" fill="#78909C"/>

  <!-- Outer Silhouette Outline -->
  <path d="
    M64 22
    C84 22 104 36 108 56
    C112 68 114 80 108 92
    C100 104 84 109 64 109
    C44 109 28 104 20 92
    C14 80 16 68 20 56
    C24 36 44 22 64 22Z" 
    stroke="#263238" stroke-width="2.5" fill="none"/>

  <!-- Elegant Curving White Whiskers (Rendered on top of everything) -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M42 78C28 78 16 82 6 87"/>
    <path d="M40 83C26 86 16 94 10 102"/>
    <path d="M86 78C100 78 112 82 122 87"/>
    <path d="M88 83C102 86 112 94 118 102"/>
  </g>
</svg>
