<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Persian cream coat gradient -->
    <linearGradient id="per_coat" x1="64" y1="20" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FDF8F0"/>
      <stop offset="100%" stop-color="#F2E6D5"/>
    </linearGradient>
    <!-- Ear pink gradient -->
    <linearGradient id="per_ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F69584"/>
      <stop offset="100%" stop-color="#E26857"/>
    </linearGradient>
    <!-- Copper amber eye gradient -->
    <linearGradient id="per_eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A1800"/>
      <stop offset="35%" stop-color="#8C3300"/>
      <stop offset="70%" stop-color="#E66500"/>
      <stop offset="100%" stop-color="#FFAB33"/>
    </linearGradient>
  </defs>

  <!-- Fluffy Chest Peek -->
