  <circle cx="50" cy="73" r="1" fill="#D5C5B5"/>
  <circle cx="46" cy="76" r="1" fill="#D5C5B5"/>
  <circle cx="78" cy="73" r="1" fill="#D5C5B5"/>
  <circle cx="82" cy="76" r="1" fill="#D5C5B5"/>

  <!-- Elegant Curving White Whiskers (Rendered on top of the face silhouette) -->
  <g stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M42 75C28 75 16 79 6 84"/>
    <path d="M40 80C26 83 16 90 10 97"/>
    <path d="M86 75C100 75 112 79 122 84"/>
    <path d="M88 80C102 83 112 90 118 97"/>
