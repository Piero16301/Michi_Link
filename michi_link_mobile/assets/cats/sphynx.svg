<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Sphynx peach skin gradient -->
    <linearGradient id="sph_skin" x1="64" y1="20" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="50%" stop-color="#FFCCBC"/>
      <stop offset="100%" stop-color="#FFAB91"/>
    </linearGradient>
    <!-- Inner ear peach-rose gradient -->
    <linearGradient id="sph_ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>
    <!-- Aqua teal anime eye gradient -->
    <linearGradient id="sph_eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00332C"/>
      <stop offset="35%" stop-color="#00695C"/>
      <stop offset="70%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#80CBC4"/>
    </linearGradient>
  </defs>

  <!-- Body / Slender Neck Peek -->
  <path d="M42 106C40 116 48 126 64 126C80 126 88 116 86 106C76 102 52 102 42 106Z" fill="#FFAB91" stroke="#3E2723" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Neck wrinkle folds -->
  <path d="M52 112C58 114 70 114 76 112" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Ear Exterior -->
  <path d="M18 4C14 2 8 8 7 14C5 28 8 46 20 56L44 32C34 18 24 6 18 4Z" fill="url(#sph_skin)" stroke="#3E2723" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left Ear Interior -->
  <path d="M18 10C14 20 14 38 22 48C26 44 34 34 38 28C32 18 24 12 18 10Z" fill="url(#sph_ear)"/>
  <!-- Cartilage ridges inside ear -->
  <path d="M18 22C24 30 30 36 34 38" stroke="#D7CCC8" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 30C20 38 24 44 26 48" stroke="#D7CCC8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right Ear Exterior -->
  <path d="M110 4C114 2 120 8 121 14C123 28 120 46 108 56L84 32C94 18 104 6 110 4Z" fill="url(#sph_skin)" stroke="#3E2723" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right Ear Interior -->
  <path d="M110 10C114 20 114 38 106 48C102 44 94 34 90 28C96 18 104 12 110 10Z" fill="url(#sph_ear)"/>
  <!-- Cartilage ridges inside ear -->
  <path d="M110 22C104 30 98 36 94 38" stroke="#D7CCC8" stroke-width="2" stroke-linecap="round"/>
  <path d="M114 30C108 38 104 44 102 48" stroke="#D7CCC8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Hairless Head Base with High Cheekbones -->
  <path d="
    M64 22
    C84 22 102 36 106 54
    C110 64 112 74 104 86
    C96 98 82 108 64 108
    C46 108 32 98 24 86
    C16 74 18 64 22 54
    C26 36 44 22 64 22Z" 
    fill="url(#sph_skin)" stroke="#3E2723" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Sphynx Forehead and Brow Wrinkle Creases -->
  <path d="M52 28C56 26 72 26 76 28" stroke="#BCAAA4" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M48 34C54 32 74 32 80 34" stroke="#BCAAA4" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M52 40C57 38 71 38 76 40" stroke="#BCAAA4" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Cheerful Happy Eyebrows -->
  <path d="M33 46C37 41 45 41 51 45" stroke="#3E2723" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M95 46C91 41 83 41 77 45" stroke="#3E2723" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- Happy Smiling Aqua Teal Anime Eyes -->
  <!-- Left Eye -->
  <g>
    <path d="M30 63C30 52 40 47 48 51C55 55 56 68 53 74C48 80 36 78 32 72C30 69 30 66 30 63Z" fill="#FFFFFF"/>
    <path d="M33 63C33 54 40 50 46 53C52 56 53 66 50 71C46 76 37 75 34 70C33 68 33 65 33 63Z" fill="url(#sph_eye)"/>
    <ellipse cx="43" cy="63" rx="5.5" ry="7.5" fill="#00211C"/>
    <path d="M36 67C38 72 44 74 48 71" stroke="#A7FFEB" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <circle cx="39" cy="58" r="3.5" fill="#FFFFFF"/>
    <circle cx="46" cy="66" r="1.8" fill="#FFFFFF"/>
    <!-- Upward joyful eyeliner wing -->
    <path d="M26 60C28 50 38 46 49 50C53 51 54 54 53 55C50 54 42 49 33 53C29 55 26 60 25 62Z" fill="#3E2723"/>
    <path d="M26 60C24 57 23 53 26 50C26 53 25 57 26 60Z" fill="#3E2723"/>
    <!-- Smiling lower eyelid contour -->
    <path d="M33 68C37 72 45 72 50 68" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Right Eye -->
  <g>
    <path d="M98 63C98 52 88 47 80 51C73 55 72 68 75 74C80 80 92 78 96 72C98 69 98 66 98 63Z" fill="#FFFFFF"/>
    <path d="M95 63C95 54 88 50 82 53C76 56 75 66 78 71C82 76 91 75 94 70C95 68 95 65 95 63Z" fill="url(#sph_eye)"/>
    <ellipse cx="85" cy="63" rx="5.5" ry="7.5" fill="#00211C"/>
    <path d="M92 67C90 72 84 74 80 71" stroke="#A7FFEB" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
    <circle cx="82" cy="58" r="3.5" fill="#FFFFFF"/>
    <circle cx="89" cy="66" r="1.8" fill="#FFFFFF"/>
    <!-- Upward joyful eyeliner wing -->
    <path d="M102 60C100 50 90 46 79 50C75 51 74 54 75 55C78 54 86 49 95 53C99 55 102 60 103 62Z" fill="#3E2723"/>
    <path d="M102 60C104 57 105 53 102 50C102 53 103 57 102 60Z" fill="#3E2723"/>
    <!-- Smiling lower eyelid contour -->
    <path d="M95 68C91 72 83 72 78 68" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Cute Rosy Blush Cheeks -->
  <ellipse cx="28" cy="73" rx="6" ry="3.5" fill="#FF8A80" opacity="0.45"/>
  <ellipse cx="100" cy="73" rx="6" ry="3.5" fill="#FF8A80" opacity="0.45"/>

  <!-- Soft Pink Button Nose -->
  <path d="M64 77C67.5 77 70 74 69.5 72C69 70.5 67 70 64 70C61 70 59 70.5 58.5 72C58 74 60.5 77 64 77Z" fill="#FF8A80"/>
  <ellipse cx="63.5" cy="71.8" rx="2.5" ry="1" fill="#FFCDD2"/>

  <!-- Beaming Open Smiling Mouth -->
  <path d="M55 81C55 81 57 89 64 89C71 89 73 81 73 81C68 82.5 60 82.5 55 81Z" fill="#A82828"/>
  <path d="M58 85C60.5 87.8 64 88.5 64 88.5C64 88.5 67.5 87.8 70 85C67 84.2 61 84.2 58 85Z" fill="#FF8DA1"/>
  <!-- Upturned :3 lip line -->
  <path d="M64 77V81M64 81C61 81 56 80 51 77.5M64 81C67 81 72 80 77 77.5" stroke="#3E2723" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Whisker Dots -->
  <circle cx="50" cy="76" r="1.2" fill="#8D6E63"/>
  <circle cx="45" cy="79" r="1.2" fill="#8D6E63"/>
  <circle cx="78" cy="76" r="1.2" fill="#8D6E63"/>
  <circle cx="83" cy="79" r="1.2" fill="#8D6E63"/>

  <!-- Outer Silhouette Outline -->
  <path d="
    M64 22
    C84 22 102 36 106 54
    C110 64 112 74 104 86
    C96 98 82 108 64 108
    C46 108 32 98 24 86
    C16 74 18 64 22 54
    C26 36 44 22 64 22Z" 
    stroke="#3E2723" stroke-width="2.5" fill="none"/>

  <!-- Short Cute Whiskers (Rendered on top) -->
  <g stroke="#8D6E63" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M44 79C36 79 30 77 24 80"/>
    <path d="M84 79C92 79 98 77 104 80"/>
  </g>
</svg>
